name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt pytest
          python -c "from mcp.server.fastmcp import FastMCP; print('mcp ok')"

      - name: Profile store unit tests
        run: python -m pytest tests/test_profile_store.py -q

      - name: Import smoke (app package)
        run: |
          python -c "from app.conversation.profile_store import Profile; print('profile ok')"
          python -c "from app.conversation.agent import start_conversation; print('agent ok')"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npm run build
